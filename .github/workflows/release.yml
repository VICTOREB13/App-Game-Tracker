name: Publicar Release Oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restaurar Dependencias
        working-directory: ./app
        run: flutter pub get

      - name: Linter y Análisis Estático (Quality Gate)
        working-directory: ./app
        run: flutter analyze

      - name: Ejecutar Pruebas Automatizadas (17 Suites)
        working-directory: ./app
        run: flutter test

  build_windows:
    name: Compilar Ejecutable Windows x64
    needs: [quality_gate]
    runs-on: windows-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Visual Studio C++ (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar Soporte de Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Diagnóstico de Entorno Flutter y Visual Studio
        run: flutter doctor -v

      - name: Generar Archivos de Plataforma Windows
        working-directory: ./app
        run: flutter create --platforms windows .

      - name: Configurar Icono Oficial Victor Engineer (Windows)
        working-directory: ./app
        shell: pwsh
        run: |
          if (Test-Path "assets/images/app_icon.ico") {
            Copy-Item -Path "assets/images/app_icon.ico" -Destination "windows/runner/resources/app_icon.ico" -Force
            Write-Host "✅ Icono app_icon.ico instalado"
          }

      - name: Restaurar Dependencias
        working-directory: ./app
        run: flutter pub get

      - name: Compilar Aplicación para Windows
        working-directory: ./app
        run: flutter build windows --release

      - name: Empaquetar Binario en Archivo ZIP
        working-directory: ./app
        shell: pwsh
        run: |
          $releasePath = if (Test-Path "build\windows\x64\runner\Release") { 
              "build\windows\x64\runner\Release" 
          } elseif (Test-Path "build\windows\runner\Release") { 
              "build\windows\runner\Release" 
          } else { 
              Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Write-Host "Comprimiendo release desde: $releasePath"
          Compress-Archive -Path "$releasePath\*" -DestinationPath "build\windows\App-Game-Tracker-Windows-x64.zip" -Force

      - name: Subir Artifact Temporal de Windows
        uses: actions/upload-artifact@v4
        with:
          name: App-Game-Tracker-Windows-x64
          path: app/build/windows/App-Game-Tracker-Windows-x64.zip

  build_android:
    name: Compilar APK Android
    needs: [quality_gate]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar Archivos de Plataforma Android
        working-directory: ./app
        run: flutter create --platforms android .

      - name: Configurar Compatibilidad de Android SDK (compileSdk 36)
        working-directory: ./app
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          fi
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (compileSdkVersion < 36) {
                    compileSdkVersion 36
                }
            }
        }
    }
}
EOF
          fi

      - name: Configurar Nombre y Permisos
        working-directory: ./app
        run: |
          sed -i 's/android:label=".*"/android:label="Rastreador de Juegos"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Configurar Iconos Oficiales Victor Engineer
        working-directory: ./app
        run: |
          if [ -d "assets/launcher_icons/android" ]; then
            cp -r assets/launcher_icons/android/* android/app/src/main/res/
          fi

      - name: Configurar Firma Criptográfica Permanente (Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          mkdir -p app/assets/keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/assets/keystore/release.keystore
            cp app/assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore restaurado desde GitHub Secrets (ANDROID_KEYSTORE_BASE64)"
          elif [ -f "app/assets/keystore/release.keystore" ]; then
            cp app/assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore local configurado"
          else
            echo "⚠️ No se detectó ANDROID_KEYSTORE_BASE64 ni release.keystore; se usará keystore por defecto"
          fi

      - name: Restaurar Dependencias
        working-directory: ./app
        run: flutter pub get

      - name: Extraer Versión de pubspec.yaml
        id: app_version
        working-directory: ./app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada para APK: $VERSION"

      - name: Compilar APK (Fat APK)
        working-directory: ./app
        run: flutter build apk --release --build-name=${{ steps.app_version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - name: Renombrar APK para Release
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk app/build/app/outputs/flutter-apk/App-Game-Tracker-Android.apk

      - name: Subir Artifact Temporal de Android
        uses: actions/upload-artifact@v4
        with:
          name: App-Game-Tracker-Android-APK
          path: app/build/app/outputs/flutter-apk/App-Game-Tracker-Android.apk

  publish_release:
    name: Publicar GitHub Release
    needs: [build_windows, build_android]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Descargar Artifacts Compilados
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./dist

      - name: Crear Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: App Game Tracker ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/App-Game-Tracker-Windows-x64.zip
            dist/App-Game-Tracker-Android.apk
