name: Quality Gate & CI Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Configurar Firma Criptográfica (Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          mkdir -p app/assets/keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/assets/keystore/release.keystore
            cp app/assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore restaurado desde GitHub Secrets (ANDROID_KEYSTORE_BASE64)"
          elif [ -f "app/assets/keystore/release.keystore" ]; then
            cp app/assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore local configurado"
          else
            echo "ℹ️ No se detectó ANDROID_KEYSTORE_BASE64 ni release.keystore; omitiendo configuración de firma"
          fi

      - name: Restaurar Dependencias
        working-directory: ./app
        run: flutter pub get

      - name: Linter y Análisis Estático (Quality Gate)
        working-directory: ./app
        run: flutter analyze

      - name: Ejecutar Pruebas Unitarias y Cobertura (Coverage)
        working-directory: ./app
        run: flutter test --coverage

      - name: Subir Reporte de Cobertura (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: app/coverage/
          if-no-files-found: ignore
